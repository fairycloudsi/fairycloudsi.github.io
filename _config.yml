# ---------------------------------------------------------------------------
# Personal academic website -- Huiwen Wu
#
# This is a USER SITE: the repository must be named exactly
#     fairycloudsi.github.io
# and it is then served from the root, https://fairycloudsi.github.io/
# That is why baseurl is empty. (A project site, e.g. a course repo, would need
# baseurl: "/repo-name" instead.)
#
# GitHub Pages builds this natively -- no plugins, no CI, no theme dependency.
# ---------------------------------------------------------------------------

title: "Huiwen Wu"
tagline: "Trustworthy foundation models, privacy-preserving LLMs, and AI for science"

# Shown in the browser tab and, more importantly, as the headline in search
# results. Leading with the name and affiliation is what makes the page rank for
# "Huiwen Wu Beihang".
title_long: "Huiwen Wu — Associate Researcher, Beihang University"

description: >-
  Huiwen Wu (Wu Huiwen) is an Associate Researcher at Beihang University, Hangzhou
  International Innovation Institute, working on differential privacy, federated
  learning, privacy-preserving large language models, and numerical analysis for
  scientific foundation models. PhD in Mathematics, UC Irvine.

# Baidu still weighs the keywords meta tag; Google ignores it. Cheap to include,
# and Baidu matters for a China-based researcher.
keywords:
  - "Huiwen Wu"
  - "Wu Huiwen"
  - "H. Wu"
  - "Beihang University"
  - "Hangzhou International Innovation Institute"
  - "Zhejiang Lab"
  - "differential privacy"
  - "federated learning"
  - "privacy-preserving machine learning"
  - "large language models"
  - "numerical analysis"
  - "multigrid"
  - "AI for science"
  - "seismic foundation model"

baseurl: ""
url: "https://fairycloudsi.github.io"

# --- Identity -------------------------------------------------------------
# Change `name` here if you prefer the family-name-first form "Wu Huiwen";
# it is used for the site title, the home page heading, and the footer.
author:
  name: "Huiwen Wu"
  role: "Associate Researcher"
  affiliation: "Beihang University, Hangzhou International Innovation Institute"
  location: "Hangzhou, Zhejiang, China"
  email: "huiwenw0820@outlook.com"
  github: "fairycloudsi"
  linkedin: "Huiwen Wu"
  scholar: "https://scholar.google.com/citations?user=EYswXa8AAAAJ&hl=en"
  genealogy: "https://www.mathgenealogy.org/id.php?id=278734"
  # Add these if you have them -- each one strengthens the identity signal.
  # orcid: "https://orcid.org/0000-0000-0000-0000"
  # dblp: "https://dblp.org/pid/xxx/yyy.html"
  # name_zh: "吴慧文"     # your name in Chinese, for Baidu and Chinese-language search
  # Phone is deliberately omitted -- see README. Add it here only if you want a
  # personal number published on a public page.

# --- Build ----------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
